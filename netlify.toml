[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.23.4"

# First-party proxy for gtag.js so networks that block googletagmanager.com still load it.
[[redirects]]
  from = "/gtag/js"
  to = "https://www.googletagmanager.com/gtag/js"
  status = 200
  force = true
